name: Actualizar Precio Binance

on:
  schedule:
    # Se ejecuta cada 12 horas (00:00 y 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Permite que tú le des al botón "Run workflow" para probar

jobs:
  build:
    runs-on: ubuntu-latest
    
    # IMPORTANTE: Esto le da permiso al robot para escribir en tu repositorio
    permissions:
      contents: write

    steps:
      - name: 1. Descargar el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar librerías necesarias
        run: |
          pip install requests pytz

      - name: 4. Ejecutar el script Scraper
        run: python scraper.py

      - name: 5. Verificar si se generó el archivo (Debug)
        run: |
          if [ -f data.json ]; then
            echo "El archivo data.json existe."
            cat data.json
          else
            echo "Error: data.json no fue encontrado."
            exit 1
          fi

      - name: 6. Guardar cambios en el repositorio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Agregamos el archivo incluso si está en el .gitignore por error
          git add -f data.json
          
          # Solo hacemos commit si hay cambios reales para evitar errores
          if git diff --staged --quiet; then
            echo "No hay cambios en el precio. Saltando commit."
          else
            git commit -m "Actualización automática: $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          fi
          
