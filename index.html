<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor P2P Binance - VES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0e11;
            color: #eaecef;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e2329;
            border: 1px solid #474d57;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        .price-value {
            font-size: 3rem;
            font-weight: 700;
            color: #f3ba2f; /* Color amarillo Binance */
        }
        .currency {
            font-size: 1.2rem;
            color: #848e9c;
        }
        .update-time {
            font-size: 0.8rem;
            color: #848e9c;
        }
        .badge-binance {
            background-color: #f3ba2f;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="card p-4 text-center">
            <div class="mb-3">
                <span class="badge badge-binance">BINANCE P2P</span>
            </div>
            <h2 class="h5 mb-4">USDT / Bolívares (VES)</h2>
            
            <div id="loading" class="spinner-border text-warning" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>

            <div id="price-container" style="display: none;">
                <div class="price-value" id="price">-</div>
                <div class="currency mb-3">VES por 1 USDT</div>
                <hr style="border-color: #474d57;">
                <p class="mb-1 text-start" style="font-size: 0.9rem;">
                    <strong>Vendedor:</strong> <span id="vendor" class="text-info">-</span>
                </p>
                <div class="update-time mt-3">
                    Actualizado: <span id="last-update">-</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Función para cargar los datos desde el JSON generado por Python
        async function fetchPrice() {
            try {
                // Agregamos un timestamp para evitar el caché del navegador
                const response = await fetch('data.json?t=' + new Date().getTime());
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('price-container').style.display = 'block';

                document.getElementById('price').innerText = parseFloat(data.price).toFixed(2);
                document.getElementById('vendor').innerText = data.vendor;
                document.getElementById('last-update').innerText = data.datetime;
            } catch (error) {
                console.error("Error cargando el precio:", error);
                document.getElementById('loading').innerHTML = "<span class='text-danger'>Error al cargar datos</span>";
            }
        }

        // Ejecutar al cargar la página
        window.onload = fetchPrice;
    </script>
</body>
</html>
