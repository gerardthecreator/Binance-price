<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance VZLA Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent: #f3ba2f;
        }
        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .glass-card:hover { transform: translateY(-5px); }
        .price-text {
            font-size: 4rem;
            font-weight: 800;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(243, 186, 47, 0.3);
        }
        .label-top { color: #848e9c; letter-spacing: 2px; font-size: 0.8rem; }
        .vendor-badge {
            background: rgba(243, 186, 47, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.85rem;
        }
        #status-dot {
            height: 10px; width: 10px; background-color: #2ebd85;
            border-radius: 50%; display: inline-block; margin-right: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card">
                <p class="label-top mb-1">TIPO DE CAMBIO P2P</p>
                <h1 class="h4 mb-4">USDT / VES</h1>
                
                <div id="loader" class="py-5">
                    <div class="spinner-grow text-warning" role="status"></div>
                </div>

                <div id="content" style="display: none;">
                    <div class="price-text" id="price">0.00</div>
                    <p class="text-secondary mb-4">Bolívares Digitales</p>
                    
                    <div class="d-flex justify-content-between align-items: center mb-4 px-3">
                        <span class="text-secondary">Vendedor</span>
                        <span class="vendor-badge" id="vendor">---</span>
                    </div>

                    <div class="pt-3 border-top border-secondary">
                        <small class="text-secondary">
                            <span id="status-dot"></span> 
                            Actualizado: <span id="time">--:--</span>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function updateData() {
        try {
            // El ?v= evita que el navegador use una versión vieja guardada
            const resp = await fetch('data.json?v=' + Date.now());
            if(!resp.ok) throw new Error();
            const data = await resp.json();
            
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            
            document.getElementById('price').innerText = data.price;
            document.getElementById('vendor').innerText = data.vendor;
            document.getElementById('time').innerText = data.datetime;
        } catch (e) {
            document.getElementById('loader').innerHTML = 
                '<span class="text-danger small">Esperando actualización de GitHub...</span>';
        }
    }
    updateData();
</script>
</body>
</html>
